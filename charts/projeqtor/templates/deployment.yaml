apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "projeqtor.fullname" . }}
  labels:
    {{- include "projeqtor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "projeqtor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "projeqtor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "projeqtor.serviceAccountName" . }}
      # ProjeQtOr never talks to the Kubernetes API, so the projected service
      # account token is an unnecessary exposure: do not mount it.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: projeqtor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "projeqtor.configMapName" . }}
            {{- $secretName := include "projeqtor.secretName" . }}
            {{- if $secretName }}
            - secretRef:
                name: {{ $secretName }}
            {{- end }}
          {{- $extraEnv := .Values.extraEnv }}
          {{- if and .Values.database.existingSecret (ne .Values.database.existingSecretKey "PQ_DB_PASSWORD") }}
          {{- $extraEnv = prepend .Values.extraEnv (dict "name" "PQ_DB_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.database.existingSecret "key" .Values.database.existingSecretKey))) }}
          {{- end }}
          {{- with $extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz.php
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz.php
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /var/www/html/files
            {{- if and .Values.parameters.content .Values.parameters.mount }}
            - name: parameters
              mountPath: /var/www/html/files/config/parameters.php
              subPath: parameters.php
              readOnly: true
            {{- end }}
      volumes:
        - name: files
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-files" (include "projeqtor.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and .Values.parameters.content .Values.parameters.mount }}
        - name: parameters
          configMap:
            name: {{ include "projeqtor.configMapName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

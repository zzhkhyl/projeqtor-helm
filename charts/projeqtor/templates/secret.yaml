{{- if and (not .Values.database.existingSecret) .Values.database.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "projeqtor.secretName" . }}
  labels:
    {{- include "projeqtor.labels" . | nindent 4 }}
type: Opaque
stringData:
  PQ_DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "projeqtor.configMapName" . }}
  labels:
    {{- include "projeqtor.labels" . | nindent 4 }}
data:
  # Database connection (non-sensitive). The container entrypoint turns these
  # values into files/config/parameters.php on first start.
  PQ_DB_TYPE: {{ .Values.env.PQ_DB_TYPE | default "mysql" | quote }}
  PQ_DB_HOST: {{ .Values.env.PQ_DB_HOST | quote }}
  PQ_DB_PORT: {{ .Values.env.PQ_DB_PORT | default "3306" | quote }}
  PQ_DB_NAME: {{ .Values.env.PQ_DB_NAME | default "projeqtor" | quote }}
  PQ_DB_USER: {{ .Values.env.PQ_DB_USER | default "projeqtor" | quote }}
  TZ: {{ .Values.env.TZ | default "UTC" | quote }}
{{- if .Values.parameters.content }}
  # Optional: complete custom parameters.php, mounted over the generated one
  # (see parameters.mount in values.yaml).
  parameters.php: |{{ .Values.parameters.content | nindent 4 }}
{{- end }}

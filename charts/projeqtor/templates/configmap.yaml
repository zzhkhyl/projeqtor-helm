apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "projeqtor.configMapName" . }}
  labels:
    {{- include "projeqtor.labels" . | nindent 4 }}
data:
  # Every key under `env` in values.yaml is injected into the container as an
  # environment variable, so adding a key there is enough - no template change
  # needed. The PQ_DB_* keys are also turned into files/config/parameters.php by
  # the container entrypoint on first start; the other keys (TZ, PQ_PG_REPAIR, …)
  # are plain container environment variables.
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- if .Values.parameters.content }}
  # Optional: complete custom parameters.php, mounted over the generated one
  # (see parameters.mount in values.yaml).
  parameters.php: |{{ .Values.parameters.content | nindent 4 }}
{{- end }}
